<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="Now Playing：紧凑态音乐指示器 + 展开态曲目卡片">
  <defs>
    <linearGradient id="np-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="np-art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d9fb8"/>
      <stop offset="100%" stop-color="#1a5a6c"/>
    </linearGradient>
  </defs>

  <rect width="420" height="200" rx="12" fill="url(#np-panel)" stroke="rgba(255,255,255,0.08)"/>

  <!-- Compact bar (real structure: logo + media thumb + session dots + metrics) -->
  <text x="16" y="22" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="8" letter-spacing="0.06em">COMPACT</text>
  <rect x="16" y="30" width="388" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <!-- Atoll logo (compact slot 34, simplified) -->
  <rect x="24" y="38" width="14" height="14" rx="3" fill="#38BDD8"/>
  <rect x="24" y="38" width="14" height="3" rx="1.5" fill="#5FD8EC"/>
  <!-- media thumb 18px -->
  <rect x="44" y="37" width="18" height="18" rx="5" fill="url(#np-art)"/>
  <!-- session dots: claude coral, codex cyan -->
  <circle cx="74" cy="44" r="6" fill="rgba(255,129,117,0.18)" stroke="#ff8175" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="90" cy="44" r="6" fill="rgba(97,216,247,0.18)" stroke="#61d8f7" stroke-width="0.8" stroke-opacity="0.5"/>
  <!-- token metrics right -->
  <text x="300" y="48" fill="rgba(255,255,255,0.42)" font-family="ui-monospace,monospace" font-size="9">170,580</text>
  <rect x="370" y="40" width="14" height="10" rx="5" fill="rgba(255,129,117,0.18)"/>
  <text x="377" y="48" text-anchor="middle" fill="#ff8b78" font-family="ui-monospace,monospace" font-size="8" font-weight="600">1</text>

  <!-- Expanded Now Playing card (real CSS: padding 8/10, gap 10, artwork 40px) -->
  <text x="16" y="80" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="8" letter-spacing="0.06em">EXPANDED · NOW PLAYING</text>
  <rect x="16" y="88" width="388" height="64" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)"/>
  <g transform="translate(26, 100)">
    <!-- artwork 40px -->
    <rect width="40" height="40" rx="8" fill="url(#np-art)"/>
    <circle cx="20" cy="20" r="12" fill="rgba(255,255,255,0.1)"/>
    <circle cx="20" cy="20" r="5" fill="rgba(255,255,255,0.06)"/>
    <!-- info: title + source, then artist, then progress -->
    <text x="50" y="12" fill="#fff" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Midnight City</text>
    <rect x="139" y="3" width="32" height="11" rx="5.5" fill="rgba(255,255,255,0.06)"/>
    <text x="155" y="11" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="system-ui,sans-serif" font-size="8">Music</text>
    <text x="50" y="24" fill="rgba(255,255,255,0.5)" font-family="system-ui,sans-serif" font-size="11">M83 · Hurry Up, We're Dreaming</text>
    <!-- progress 2px -->
    <rect x="50" y="32" width="220" height="2" rx="1" fill="rgba(255,255,255,0.08)"/>
    <rect x="50" y="32" width="80" height="2" rx="1" fill="rgba(255,255,255,0.5)" opacity="0.6"/>
    <!-- controls: prev 24, play 28, next 24 -->
    <g transform="translate(280, 2)">
      <rect width="24" height="24" rx="6" fill="transparent"/>
      <path d="M14 6 L6 12 L14 18 Z M4 6 L2 6 L2 18 L4 18 Z" fill="rgba(255,255,255,0.5)"/>
      <rect x="30" y="0" width="28" height="28" rx="7" fill="rgba(255,255,255,0.08)"/>
      <path d="M42 8 L50 14 L42 20 Z" fill="#fff"/>
      <rect x="64" width="24" height="24" rx="6" fill="transparent"/>
      <path d="M70 6 L78 12 L70 18 Z M80 6 L82 6 L82 18 L80 18 Z" fill="rgba(255,255,255,0.5)"/>
    </g>
  </g>
</svg>
