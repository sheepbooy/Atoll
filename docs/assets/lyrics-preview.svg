<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="滚动歌词：紧凑胶囊中部歌词行随播放滚动">
  <defs>
    <linearGradient id="ly-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#111317"/>
    </linearGradient>
    <linearGradient id="ly-art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d9fb8"/>
      <stop offset="100%" stop-color="#1a5a6c"/>
    </linearGradient>
  </defs>

  <rect width="420" height="120" rx="12" fill="url(#ly-panel)" stroke="rgba(255,255,255,0.08)"/>

  <!-- Compact bar with lyrics in the middle (real structure) -->
  <text x="16" y="22" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="8" letter-spacing="0.06em">COMPACT · 歌词随播放滚动</text>
  <rect x="16" y="30" width="388" height="28" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>

  <!-- Atoll logo -->
  <rect x="24" y="38" width="14" height="14" rx="3" fill="#38BDD8"/>
  <rect x="24" y="38" width="14" height="3" rx="1.5" fill="#5FD8EC"/>
  <!-- media thumb 18px -->
  <rect x="44" y="37" width="18" height="18" rx="5" fill="url(#ly-art)"/>
  <!-- session dots -->
  <circle cx="74" cy="44" r="6" fill="rgba(255,129,117,0.18)" stroke="#ff8175" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Lyrics marquee column (140px wide, centered, 11px font) -->
  <rect x="100" y="32" width="140" height="24" rx="4" fill="rgba(97,216,247,0.03)"/>
  <text x="170" y="47" text-anchor="middle" fill="rgba(232,234,237,0.82)" font-family="system-ui,sans-serif" font-size="11" font-weight="500">🎵 City in the dark...</text>

  <!-- token metrics right -->
  <text x="310" y="48" fill="rgba(255,255,255,0.42)" font-family="ui-monospace,monospace" font-size="9">170,580</text>
  <rect x="372" y="40" width="14" height="10" rx="5" fill="rgba(255,129,117,0.18)"/>
  <text x="379" y="48" text-anchor="middle" fill="#ff8b78" font-family="ui-monospace,monospace" font-size="8" font-weight="600">1</text>

  <!-- Lyric timeline (shows scroll progression) -->
  <text x="16" y="78" fill="rgba(255,255,255,0.38)" font-family="system-ui,sans-serif" font-size="8" letter-spacing="0.06em">LYRICS TIMELINE</text>

  <!-- 3 lines: prev (dim), current (bright), next (dim) -->
  <text x="210" y="98" text-anchor="middle" fill="rgba(255,255,255,0.28)" font-family="system-ui,sans-serif" font-size="10">Standing in the hall</text>
  <text x="210" y="112" text-anchor="middle" fill="#e8eaed" font-family="system-ui,sans-serif" font-size="11" font-weight="600">City in the dark, come alive</text>
</svg>
