<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor — 官方图标预览</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 24px 56px;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124, 95, 212, 0.2), transparent),
        #0a0b0d;
      color: #e8eaed;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header { max-width: 720px; margin: 0 auto 36px; text-align: center; }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(167, 139, 250, 0.75);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(232, 234, 237, 0.62);
    }
    .hero {
      max-width: 960px;
      margin: 0 auto 40px;
      text-align: center;
    }
    .hero-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      padding: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(167, 139, 250, 0.14);
    }
    .hero-caption {
      margin: 12px 0 0;
      font-size: 13px;
      color: rgba(232, 234, 237, 0.55);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      max-width: 960px;
      margin: 0 auto;
    }
    .card {
      padding: 16px 12px 14px;
      text-align: center;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .card-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      margin-bottom: 10px;
    }
    .card-label {
      margin: 0 0 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(196, 181, 253, 0.95);
    }
    .card-hint {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(232, 234, 237, 0.45);
    }
    footer {
      max-width: 960px;
      margin: 36px auto 0;
      text-align: center;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(232, 234, 237, 0.28);
    }

    .cursor-mascot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    .cursor-mascot-svg { overflow: visible; }
    .cursor-mascot-body {
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    .cursor-mascot-star,
    .cursor-mascot-heart,
    .cursor-mascot-z,
    .cursor-mascot-sweat,
    .cursor-mascot-bang,
    .cursor-mascot-cube,
    .cursor-mascot-mark {
      transform-box: fill-box;
      transform-origin: center;
    }
    .cursor-mascot.is-calm .cursor-mascot-body { animation: float 2.8s ease-in-out infinite; }
    .cursor-mascot.is-sleeping .cursor-mascot-body { animation: float-slow 3.6s ease-in-out infinite; }
    .cursor-mascot.is-alert .cursor-mascot-body { animation: alert-hop 0.85s ease-in-out infinite; }
    .cursor-mascot.is-happy .cursor-mascot-body { animation: bounce 0.6s ease-in-out infinite; }
    .cursor-mascot.is-worried .cursor-mascot-body { animation: tremble 0.5s ease-in-out infinite; }
    .cursor-mascot.is-sad .cursor-mascot-body { transform: translateY(8%); }
    .cursor-mascot.is-alert .cursor-mascot-cube {
      transform-origin: center bottom;
      animation: cube-tilt 0.85s ease-in-out infinite;
    }
    .cursor-mascot-star { opacity: 0; }
    .cursor-mascot-star-0 { animation: twinkle 1.2s ease-in-out infinite; }
    .cursor-mascot-star-1 { animation: twinkle 1.2s ease-in-out infinite 0.4s; }
    .cursor-mascot-star-2 { animation: twinkle 1.2s ease-in-out infinite 0.8s; }
    .cursor-mascot-heart { animation: heart-rise 1.8s ease-out infinite; }
    .cursor-mascot-z { opacity: 0; }
    .cursor-mascot-z-0 { animation: zzz-rise 2.4s ease-in-out infinite; }
    .cursor-mascot-z-1 { animation: zzz-rise 2.4s ease-in-out infinite 0.5s; }
    .cursor-mascot-z-2 { animation: zzz-rise 2.4s ease-in-out infinite 1s; }
    .cursor-mascot-sweat { animation: sweat-fall 1.3s ease-in-out infinite; }
    .cursor-mascot-bang { animation: bang-pop 0.7s ease-in-out infinite; }

    @keyframes float { 0%, 100% { transform: translateY(6%); } 50% { transform: translateY(-6%); } }
    @keyframes float-slow { 0%, 100% { transform: translateY(2%); } 50% { transform: translateY(9%); } }
    @keyframes alert-hop {
      0%, 100% { transform: translateY(0) scaleY(1); }
      30% { transform: translateY(-13%) scaleY(1.04); }
      60% { transform: translateY(0) scaleY(0.94); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(9%) scale(1, 1); }
      40% { transform: translateY(-16%) scale(1.04, 1.06); }
      70% { transform: translateY(0) scale(0.99, 0.94); }
    }
    @keyframes tremble { 0%, 100% { transform: translate(-3%, 2%); } 50% { transform: translate(3%, 2%); } }
    @keyframes claw-l { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-24deg); } }
    @keyframes claw-r { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(24deg); } }
    @keyframes leg-step { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16%); } }
    @keyframes cube-tilt {
      0%, 60%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-2deg); }
      45% { transform: rotate(2deg); }
    }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(0.3); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes heart-rise { 0% { opacity: 0; transform: translateY(10%) scale(0.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-45%) scale(1.1); } }
    @keyframes zzz-rise { 0% { opacity: 0; transform: translate(0, 10%); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(30%, -70%); } }
    @keyframes sweat-fall { 0% { opacity: 0; transform: translateY(-40%); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(160%); } }
    @keyframes bang-pop { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14%) scale(1.14); } }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Atoll Agent Mascot</p>
    <h1>Cursor</h1>
    <p class="subtitle">官方 2.5D 立方体图标 · 七种 mood</p>
  </header>

  <section class="hero">
    <div class="hero-stage" id="hero"></div>
    <p class="hero-caption">calm — 默认态</p>
  </section>

  <div class="grid" id="grid"></div>

  <footer>official 2.5D cube · cursor.com/brand · 双击本文件即可离线查看</footer>

  <script src="js/cursor-mascot.js"></script>
  <script>
    const MOODS = [
      { mood: "calm", hint: "空闲 · 悬浮呼吸" },
      { mood: "alert", hint: "待审批 · 弹跳 + !!" },
      { mood: "happy", hint: "完成 · 星心特效" },
      { mood: "worried", hint: "异常 · 发绿 + 汗" },
      { mood: "sad", hint: "低落 · 垂眉下沉" },
      { mood: "sleeping", hint: "休眠 · zzz" },
      { mood: "dead", hint: "离线 · 灰化" },
    ];

    window.AtollCursorMascot.mount(document.getElementById("hero"), "calm", 168);

    const grid = document.getElementById("grid");
    for (const { mood, hint } of MOODS) {
      const card = document.createElement("article");
      card.className = "card";
      const stage = document.createElement("div");
      stage.className = "card-stage";
      card.appendChild(stage);
      const label = document.createElement("p");
      label.className = "card-label";
      label.textContent = mood;
      card.appendChild(label);
      const hintEl = document.createElement("p");
      hintEl.className = "card-hint";
      hintEl.textContent = hint;
      card.appendChild(hintEl);
      grid.appendChild(card);
      window.AtollCursorMascot.mount(stage, mood, 120);
    }
  </script>
</body>
</html>
